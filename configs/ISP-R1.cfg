!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : ISP-R1
! Device Type : Cisco 2911 Router
! Role        : Internet Service Provider (ISP) Router
!==========================================================

hostname ISP-R1

!
!==========================================================
! Interface Configuration
!==========================================================

interface GigabitEthernet0/0
 description Link-to-EDGE
 ip address 203.0.113.1 255.255.255.252

interface GigabitEthernet0/1
 description Link-to-Internet
 ip address 198.51.100.1 255.255.255.252

interface GigabitEthernet0/2
 shutdown

!
!==========================================================
! OSPF Configuration
!==========================================================

router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes
 network 203.0.113.0 0.0.0.3 area 0

!
!==========================================================
! Static Routes
!==========================================================

ip route 0.0.0.0 0.0.0.0 198.51.100.2
ip route 198.51.101.0 255.255.255.0 198.51.100.2

!
!==========================================================
! System Services
!==========================================================

logging 192.168.99.10
ntp server 192.168.99.10

!
!==========================================================
! Security
!==========================================================

no ip domain-lookup

banner motd ^C
Unauthorized Access Prohibited
^C

!
!==========================================================
! Remote Access
!==========================================================

line con 0
 logging synchronous
 login

line vty 0 4
 login
 transport input telnet

!
!==========================================================
! Verification Summary
!==========================================================

! Interfaces
! ----------
! G0/0 -> EDGE-R1
! G0/1 -> INTERNET-R1

! Routing
! -------
! OSPF Neighbor : 2.2.2.2 (EDGE-R1)
! Default Route : 198.51.100.2
! Static Route  : 198.51.101.0/24

! NAT
! ---
! Not Configured

! ACL
! ---
! None Configured

! Notes
! -----
! Acts as the simulated ISP router between the
! Enterprise Edge Router and the Public Internet Router.

end