!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : INTERNET-R1
! Device Type : Cisco Router
! Role        : Simulated Internet Router
!==========================================================

hostname INTERNET-R1

!
!==========================================================
! Interface Configuration
!==========================================================
interface GigabitEthernet0/0
 description Link-to-ISP
 ip address 198.51.100.2 255.255.255.252

interface GigabitEthernet0/1
 description Public-LAN
 ip address 198.51.101.1 255.255.255.0

interface GigabitEthernet0/2
 shutdown

!
!==========================================================
! Static Routing
!==========================================================

ip route 10.255.255.0 255.255.255.252 198.51.100.1
ip route 192.168.0.0 255.255.0.0 198.51.100.1
ip route 203.0.113.0 255.255.255.252 198.51.100.1

!
!==========================================================
! Remote Access
!==========================================================

line vty 0 4
 login

!
!==========================================================
! Notes
!==========================================================

! This router simulates the public Internet.
! It provides connectivity to the simulated public DNS,
! Web, and FTP servers.
! Enterprise private networks are reachable through
! static routes pointing toward the ISP router.

end