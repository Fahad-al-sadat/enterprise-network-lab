!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : CORE-SW1
! Device Type : Cisco Layer-3 Switch
! Role        : Core Layer Switch
!==========================================================

hostname CORE-SW1

!
!==========================================================
! Layer-3 Routing
!==========================================================

ip routing

!
!==========================================================
! Routed Interface
!==========================================================

interface FastEthernet0/1
 description Link-to-EDGE-R1
 no switchport
 ip address 10.255.255.2 255.255.255.252

!
!==========================================================
! Trunk Links
!==========================================================

interface FastEthernet0/2
 description Uplink-to-DIST-SW1
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999

interface FastEthernet0/3
 description Uplink-to-DIST-SW2
 switchport mode trunk
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999

!
!==========================================================
! VLAN Interfaces (SVI)
!==========================================================

interface Vlan10
 description Management Gateway
 ip address 192.168.10.1 255.255.255.0

interface Vlan20
 description HR Gateway
 ip address 192.168.20.1 255.255.255.0
 ip access-group HR-FILTER in

interface Vlan30
 description Finance Gateway
 ip address 192.168.30.1 255.255.255.0
 ip access-group FINANCE-FILTER in

interface Vlan40
 description IT Gateway
 ip address 192.168.40.1 255.255.255.0

interface Vlan50
 description Sales Gateway
 ip address 192.168.50.1 255.255.255.0
 ip access-group SALES-FILTER in

interface Vlan99
 description Server Gateway
 ip address 192.168.99.1 255.255.255.0

!
!==========================================================
! DHCP Services
!==========================================================

! DHCP Pools Configured:
! - MANAGEMENT
! - HR
! - FINANCE
! - IT
! - SALES
! - SERVERS
!
! DNS Server  : 192.168.99.10
! Default GW  : VLAN Gateway
! Reserved IP : .1 - .20

!
!==========================================================
! OSPF Configuration
!==========================================================

router ospf 1
 router-id 1.1.1.1

 network 10.255.255.0 0.0.0.3 area 0
 network 192.168.10.0 0.0.0.255 area 0
 network 192.168.20.0 0.0.0.255 area 0
 network 192.168.30.0 0.0.0.255 area 0
 network 192.168.40.0 0.0.0.255 area 0
 network 192.168.50.0 0.0.0.255 area 0
 network 192.168.99.0 0.0.0.255 area 0

 passive-interface Vlan10
 passive-interface Vlan20
 passive-interface Vlan30
 passive-interface Vlan40
 passive-interface Vlan50
 passive-interface Vlan99

!
!==========================================================
! Access Control Lists
!==========================================================

ip access-list extended HR-FILTER
 deny ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255
 permit ip any any

ip access-list extended FINANCE-FILTER
 deny ip 192.168.30.0 0.0.0.255 192.168.20.0 0.0.0.255
 permit ip any any

ip access-list extended SALES-FILTER
 deny ip 192.168.50.0 0.0.0.255 192.168.30.0 0.0.0.255
 permit ip any any

!
!==========================================================
! SSH
!==========================================================

ip domain-name enterprise.local
ip ssh version 2

username admin privilege 15 secret ********

line vty 0 4
 login local
 transport input ssh

!
!==========================================================
! System Services
!==========================================================

logging 192.168.99.10
ntp server 192.168.99.10

banner motd ^C
Unauthorized Access Prohibited
^C

!
!==========================================================
! Verification Summary
!==========================================================

! Routed Link
! -----------
! Fa0/1 -> EDGE-R1

! Trunks
! ------
! Fa0/2 -> DIST-SW1
! Fa0/3 -> DIST-SW2

! VLAN Gateways
! -------------
! VLAN10 : 192.168.10.1
! VLAN20 : 192.168.20.1
! VLAN30 : 192.168.30.1
! VLAN40 : 192.168.40.1
! VLAN50 : 192.168.50.1
! VLAN99 : 192.168.99.1

! OSPF Neighbor
! -------------
! EDGE-R1 (2.2.2.2)

! DHCP
! ----
! 6 DHCP Pools Active

! ACL
! ---
! HR-FILTER
! FINANCE-FILTER
! SALES-FILTER

! Remote Access
! -------------
! SSH Enabled

end