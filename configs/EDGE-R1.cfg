!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : EDGE-R1
! Device Type : Cisco 2911 Router
! Role        : Enterprise Edge Router
!==========================================================

hostname EDGE-R1

!
!==========================================================
! Interface Configuration
!==========================================================

interface GigabitEthernet0/0
 description Link-to-ISP
 ip address 203.0.113.2 255.255.255.252
 ip nat outside

interface GigabitEthernet0/1
 description Link-to-CORE
 ip address 10.255.255.1 255.255.255.252
 ip nat inside

interface GigabitEthernet0/2
 shutdown

!
!==========================================================
! OSPF Configuration
!==========================================================

router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes
 network 10.255.255.0 0.0.0.3 area 0
 network 203.0.113.0 0.0.0.3 area 0
 default-information originate

!
!==========================================================
! NAT / PAT Configuration
!==========================================================

access-list 1 permit 192.168.0.0 0.0.255.255

ip nat inside source list 1 interface GigabitEthernet0/0 overload

!
!==========================================================
! Static Route
!==========================================================

ip route 0.0.0.0 0.0.0.0 203.0.113.1

!
!==========================================================
! System Services
!==========================================================

logging 192.168.99.10
ntp server 192.168.99.10

!
!==========================================================
! Security
!==========================================================

no ip domain-lookup

banner motd ^C
Unauthorized Access Prohibited
^C

!
!==========================================================
! Remote Access
!==========================================================

line con 0
 logging synchronous
 login

line vty 0 4
 login
 transport input telnet

!
!==========================================================
! Verification Summary
!==========================================================

! Interfaces
! ----------
! G0/0 -> ISP-R1
! G0/1 -> CORE-SW1

! OSPF Neighbors
! --------------
! ISP-R1  (3.3.3.3)
! CORE-SW1 (1.1.1.1)

! NAT/PAT
! -------
! Dynamic PAT enabled
! Inside Interface  : G0/1
! Outside Interface : G0/0

! ACL
! ---
! ACL 1
! Permit 192.168.0.0/16

! Default Route
! -------------
! 0.0.0.0/0 -> 203.0.113.1

! Notes
! -----
! Enterprise Edge Router connecting the internal
! enterprise network to the ISP.
! Performs PAT (NAT Overload) for all internal VLANs
! and advertises the default route through OSPF.

end