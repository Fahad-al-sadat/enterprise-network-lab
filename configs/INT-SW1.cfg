!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : INT-SW1
! Device Type : Cisco Layer 2 Switch
! Role        : Public Internet Switch
!==========================================================

hostname INT-SW1

!
!==========================================================
! Spanning Tree Configuration
!==========================================================

spanning-tree mode pvst
spanning-tree extend system-id

!
!==========================================================
! Interface Configuration
!==========================================================

interface FastEthernet0/1
 description Link_to_Internet_Router

interface FastEthernet0/2
 description Link_to_Internet_DNS

interface FastEthernet0/3
 description Link_to_Internet_WEB_Server

interface FastEthernet0/4
 description Link_to_Internet_FTP_Server

!
!==========================================================
! Remote Access
!==========================================================

line vty 0 4
 login

!
!==========================================================
! Device Summary
!==========================================================

! Active Interfaces
! -----------------
! Fa0/1 -> Internet Router
! Fa0/2 -> Public DNS Server
! Fa0/3 -> Public Web Server
! Fa0/4 -> Public FTP Server

! VLAN
! ----
! VLAN 1 (Default)

! Trunk Links
! -----------
! None

! Notes
! -----
! This switch provides Layer 2 connectivity for the
! simulated public Internet infrastructure.

end