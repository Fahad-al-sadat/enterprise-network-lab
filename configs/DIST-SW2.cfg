!==========================================================
! Enterprise Network Lab
!==========================================================
! Device Name : DIST-SW2
! Device Type : Cisco Layer-2 Switch
! Role        : Distribution Switch
!==========================================================

hostname DIST-SW2

!
!==========================================================
! Trunk Interfaces
!==========================================================

interface FastEthernet0/1
 description Uplink-to-CORE-SW1
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999

interface FastEthernet0/2
 description Downlink-to-ACC-SW3
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999

interface FastEthernet0/3
 description Downlink-to-ACC-SW4
 switchport mode trunk
 switchport trunk native vlan 999
 switchport trunk allowed vlan 10,20,30,40,50,99,999

!
!==========================================================
! VLAN Database
!==========================================================

vlan 10
 name MANAGEMENT

vlan 20
 name HR

vlan 30
 name FINANCE

vlan 40
 name IT

vlan 50
 name SALES

vlan 99
 name SERVERS

vlan 999
 name NATIVE

!
!==========================================================
! Layer-2 Configuration
!==========================================================

spanning-tree mode pvst
spanning-tree extend system-id

!
!==========================================================
! System Services
!==========================================================

logging 192.168.99.10
ntp server 192.168.99.10

!
!==========================================================
! Security
!==========================================================

no ip domain-lookup

banner motd ^C
Unauthorized Access Prohibited
^C

!
!==========================================================
! Remote Access
!==========================================================

line con 0
 logging synchronous
 login

line vty 0 4
 login
 transport input telnet

!
!==========================================================
! Verification Summary
!==========================================================

! Uplink
! ------
! Fa0/1 -> CORE-SW1

! Downlinks
! ---------
! Fa0/2 -> ACC-SW3
! Fa0/3 -> ACC-SW4

! Trunks
! ------
! Native VLAN : 999
! Allowed VLANs : 10,20,30,40,50,99,999

! VLANs
! -----
! 10  Management
! 20  HR
! 30  Finance
! 40  IT
! 50  Sales
! 99  Servers
! 999 Native

! Notes
! -----
! Layer-2 Distribution Switch
! Provides VLAN trunk connectivity between
! Core Switch and Access Switches.

end